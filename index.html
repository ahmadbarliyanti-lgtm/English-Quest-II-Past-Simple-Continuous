{t:'An Awful Holiday',i:{id:'Pilih kata yang benar untuk melengkapi teks.',en:'Choose the correct words to complete the text.'},k:'para',x:"Last year I [[went|did]] camping in Ireland with Jan and Emma. We [[got|get]] the ferry to Dublin and went to a [[campsite|camping]] near the beach. We got there about seven o’clock at night but the supermarket on the campsite [[was|were]] shut so we didn’t [[have|had]] any food. I looked in my [[rucksack|sleeping bag]] for the tent but it [[wasn’t|not]] there! Jan had her tent so we all used one tent. It took half an hour to put the tent up. It was very small so we didn’t [[sleep|slept]] very well. In the middle of the night it started raining and it rained all night. When I got up my sleeping bag was wet. It was awful. After that we stayed in a [[hotel|tent]]."},
{t:'Past Simple: Irregular Verbs',i:{id:'Tulis bentuk past simple dari kata kerja tidak beraturan (cari di kotak huruf).',en:'Write the past simple of each irregular verb (find them in the grid).'},k:'tx',

x:[["1. go",['^went$'],1,"went"],["2. see",['^saw$'],1,"saw"],["3. sleep",['^slept$'],1,"slept"],["4. take",['^took$'],1,"took"],["5. have",['^had$'],1,"had"],["6. say",['^said$'],1,"said"],["7. come",['^came$'],1,"came"],["8. get",['^got$'],1,"got"],["9. am",['^was$'],1,"was"],["10. are",['^were$'],1,"were"]]},
{t:'Past Simple: Regular Verbs',i:{id:'Tulis past simple dari kata kerja dalam kotak.',en:'Type the past simple of the verbs in the box.'},k:'tx',b:'use · live · walk · play · finish · start · visit · talk · watch · sail',
x:[["Last weekend I v****** my grandmother in Scotland.",['^visited$'],1,"visited"],["Three years ago we s***** across the Mediterranean.",['^sailed$'],1,"sailed"],["We p***** tennis for two hours yesterday.",['^played$'],1,"played"],["Jane l**** in Australia when she was little.",['^lived$'],1,"lived"],["I s****** school when I was four.",['^started$'],1,"started"]]},
{t:'Question Words',i:{id:'Ketik kata tanya: Where, What, Why, How atau When.',en:'Type Where, What, Why, How or When.'},k:'tx',x:[["W**** were you born?",['^where$'],1,"Where"],["W*** did you start school?",['^when$'],1,"When"],["W*** school did you go to?",['^what$'],1,"What"],["H** did you get to school this morning?",['^how$'],1,"How"],["W** was your best friend at school?",['^why$'],1,"Why"]]},
{t:'Past Simple: Questions',i:{id:'Susun kata menjadi kalimat tanya yang benar (ketik kalimatnya).',en:'Put the words in the correct order and type the question.'},k:'tx',x:[["last · did · you · Where · go · night · ?",['^where did you go last night\\??$'],1,"Where did you go last night?"],["film · see · What · did · you · ?",['^what film did you see\\??$'],1,"What film did you see?"],["film · like · What · the · was · ?",['^what was the film like\\??$'],1,"What was the film like?"],["you · with · Who · go · did · ?",['^who did you go with\\??$'],1,"Who did you go with?"],["get · the · you · to · did · How · cinema · ?",['^how did you get to the cinema\\??$'],1,"How did you get to the cinema?"]]},
{t:'Questions and Answers',i:{id:'Pasangkan pertanyaan dan jawaban.',en:'Match the questions and the answers.'},k:'mt',x:[["‘Was Marie Curie a scientist?’","Yes, she was. She won the Nobel Prize."],["‘Did you watch the football last week?’","No, I didn’t. I had exams."],["‘Was William Shakespeare a painter?’","No, he wasn’t. He was a writer."],["‘Did you and Kate win first prize?’","No, we didn’t. We finished second."],["‘Were the Wright brothers actors?’","No, they weren’t. They were pilots."]]},

{t:'Past Continuous',i:{id:'Pasangkan awal dan akhir kalimat.',en:'Match the beginnings and endings.'},k:'mt',x:[["Jeff didn’t have a barbeque because","it was raining."],["We didn’t climb the mountain because","we weren’t wearing the right shoes."],["A policeman stopped us because","we were driving very fast."],["Emma couldn’t come to the party because","she was studying for an exam."],["Fran didn’t see Kate because","she was waiting in the wrong place."]]},
{t:'An Interview with a Grandmother',i:{id:'Lengkapi teks dengan kata dari kotak.',en:'Complete the text with the words from the box.'},k:'para',x:"Jake: What was the town like when you were young?\nGrandmother: When I was young things were very different. The town was very small and was called a [[village]]. There were only about 500 people here. You [[could]] walk for ten minutes and then that was the end of the town. There was only one [[bridge]] over the [[river]] not like now.\nJake: What could you do in the evening?\nGrandmother: You [[couldn’t]] go to the cinema of course because [[there wasn’t]] a cinema, but [[there was]] a small theatre, which is not here now. You could go to the square and meet people and talk. [[There were]] always people standing and [[talking]] in the square. People were very [[friendly]] in those days."},
{t:'Could / Couldn’t',i:{id:'Ketik could atau couldn’t.',en:'Type could or couldn’t.'},k:'tx',x:[["Jane c**** play the piano when she was five. Her mum taught her to play.",['^could$'],1,"could"],["We c******* swim because there were sharks in the sea!",['^couldn.?t$'],1,"couldn’t"],["I was in hospital for two months so I c******* go to school.",['^couldn.?t$'],1,"couldn’t"],["We c******* watch TV last night because it was broken.",['^couldn.?t$'],1,"couldn’t"],["Juan c**** speak two languages when he was four: French and Spanish.",['^could$'],1,"could"]]}];
let L='id',S=null,cur='home',user=0;
const T=k=>TX[L][k];
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shuf=(a,r)=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fresh=()=>({id:{nm:'',cl:'',no:'',md:''},key:'',seed:1,a:A.map(()=>({at:0,s:null,e:null,done:0,sc:null,ans:{}}))});

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3200)}
// ---- build activity (deterministic from identity seed) ----
function build(i){
 const a=A[i],st=S.a[i],r=rng(S.seed+i*97+st.at*13),U=[];let h='';
 const dis=st.done?'disabled':'';
 const val=k=>esc(st.ans[k]??'');
 const mark=(n,ok,ans)=>st.done?` <b class="${ok?'good':'bad'}">${ok?'✓':'✗ '+esc(ans)}</b>`:'';
 if(a.k=='para'){
  const w=[...a.x.matchAll(/\[\[(.*?)\]\]/g)].map(m=>m[1].split('|')[0]),bank=shuf(w,r),per=a.x.includes('|');let n=0;
  h+=`<div class="bank">${per?'':bank.map(b=>`<span>${b}</span>`).join('')}</div><p style="line-height:2.4;white-space:pre-line">`+a.x.replace(/\[\[(.*?)\]\]/g,(m,raw)=>{const ps=raw.split('|'),ans=ps[0],bk=shuf(ps.length>1?ps:bank,r);const k='p'+n++;U.push({k,ok:v=>v==ans,ans});
   return `<select data-k="${k}" ${dis}><option value="">…</option>${bk.map(b=>`<option ${st.ans[k]==b?'selected':''}>${b}</option>`).join('')}</select>${mark(k,st.ans[k]==ans,ans)}`})+'</p>';
 }
 if(a.k=='mc'){
  shuf(a.x.map((x,j)=>j),r).forEach((j,n)=>{const [q,o,c]=a.x[j],k='m'+j,ord=shuf(o.map((_,z)=>z),r);U.push({k,ok:v=>v==c,ans:o[c]});
   h+=`<div class="q"><b>${n+1}.</b> ${esc(q).replace(/\n/g,'<br>')}${mark(k,st.ans[k]==c,o[c])}${ord.map(z=>`<label class="opt"><input type="radio" name="${k}" data-k="${k}" value="${z}" ${st.ans[k]==z?'checked':''} ${dis}> ${esc(o[z])}</label>`).join('')}</div>`});
 }
 if(a.k=='tx'){
  if(a.p)h+=`<div class="card pas">${esc(a.p)}</div>`;
  if(a.b)h+=`<div class="bank"><span>${a.b}</span></div>`;
  if(a.g)h+=`<table class="gr">${a.g.map(row=>`<tr>${[...row].map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
  shuf(a.x.map((x,j)=>j),r).forEach((j,n)=>{if(a.g)j=n;const [q,ks,min,ans]=a.x[j],k='t'+j;
   const ok=v=>{v=v.toLowerCase().replace(/[’`]/g,"'").trim();return ks.filter(z=>new RegExp(z,'i').test(v)).length>=min};
   U.push({k,ok,ans});h+=`<div class="q">${a.g?'':(n+1)+'. '}${esc(q)}<br><input data-k="${k}" value="${val(k)}" autocomplete="off" ${dis} style="width:min(420px,100%);margin-top:4px">${mark(k,ok(st.ans[k]||''),ans)}</div>`});
 }
 if(a.k=='mt'){
  const ends=shuf(a.x.map(x=>x[1]),r);
  shuf(a.x.map((x,j)=>j),r).forEach((j,n)=>{const [q,e]=a.x[j],k='x'+j;U.push({k,ok:v=>v==e,ans:e});
   h+=`<div class="q">${n+1}. ${esc(q)}<br><select data-k="${k}" ${dis}><option value="">…</option>${ends.map(z=>`<option ${st.ans[k]==z?'selected':''}>${esc(z)}</option>`).join('')}</select>${mark(k,st.ans[k]==e,e)}</div>`});
 }
 return{h,U};
}
const grade=i=>{const{U}=build(i),st=S.a[i];const c=U.filter(u=>u.ok(st.ans[u.k]??'')).length;return Math.round(c/U.length*100)};
function submit(i,auto){const st=S.a[i];if(st.done)return;st.sc=grade(i);st.done=1;if(auto)toast(T('ta'));if(cur==i)show()}
// ---- UI ----
const stat=i=>{const s=S.a[i];return s.done?'✓ '+s.sc:s.s?'⏱':'·'};
function side(){
 $('#side').innerHTML=`<h2 class="gold" style="margin:4px 8px 14px">ENGLISH QUEST II</h2><div class="nav ${cur=='home'?'on':''}" data-p="home">🏠 ${T('idn')}</div>`+A.map((a,i)=>`<div class="nav ${cur==i?'on':''}" data-p="${i}"><span>${i+1}. ${a.t}</span><span class="o" style="color:var(--g)">${stat(i)}</span></div>`).join('')+`<div style="flex:1"></div><div class="nav" id="lo">⎋ ${T('lo')}</div><div style="font-size:12px;color:var(--mu);padding:8px 12px">${T('by')} <b class="gold">Ahmad Budi Leksono</b></div>`;
}
function idOk(){const d=S.id;return d.nm&&d.cl&&d.no&&d.md}

 side();$('#th').textContent=document.documentElement.dataset.theme=='light'?T('dark'):T('light');
 const v=$('#view');
 if(cur=='home'){const d=S.id;
  v.innerHTML=`<h1 class="gold">${T('idn')}</h1><p style="color:var(--mu)">${T('wl')}</p><div class="card"><div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${[['nm','nm'],['cl','cl'],['no','no'],['md','md']].map(([k,l])=>`<label>${T(l)}<br><input id="i_${k}" value="${esc(d[k])}" style="width:100%" autocomplete="off"></label>`).join('')}</div><p><button class="btn" id="sv">${T('sv')}</button></p><p style="color:var(--mu);font-size:13px">🔒 ${T('kunci')}</p></div>`;
  return;}
 const i=+cur,a=A[i],st=S.a[i];
 if(!idOk()){toast(T('need'));cur='home';return show()}
 if(!st.s){st.s=Date.now();st.e=st.s+40*60000}
 const{h}=build(i);
 v.innerHTML=`<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><h2 class="gold" style="margin:0">${T('act')} ${i+1}: ${a.t}</h2><div>${T('left')}: <span id="cd" class="tm"></span></div></div><p style="color:var(--mu)">${a.i[L]}</p><div class="card">${h}</div>
 <div>${st.done?`<p class="o">${T('score')}: <span class="gold" style="font-size:26px">${st.sc}</span></p>${st.sc>=80?`<button class="btn" id="ce">🏆 ${T('cert')}</button>`:`<p class="bad">${T('fail')}</p>`} <button class="btn s" id="rt">${T('retry')}</button>`:`<button class="btn" id="sb">${T('sub')}</button>`}</div>`;
 tick();
}
const p2=n=>String(n).padStart(2,'0');
function tick(){
 const n=new Date();$('#clk').textContent=`${p2(n.getHours())}:${p2(n.getMinutes())}:${p2(n.getSeconds())}`;
 A.forEach((_,i)=>{const s=S.a[i];if(s.s&&!s.done&&Date.now()>=s.e)submit(i,1)});
 if(cur!='home'){const s=S.a[+cur],c=$('#cd');if(c&&s.s&&!s.done){const r=Math.max(0,s.e-Date.now()),m=Math.floor(r/60000);c.textContent=`${p2(m)}:${p2(Math.floor(r/1000)%60)}`;c.className='tm'+(m<5?' w':'')}else if(c)c.textContent='--:--'}
}
function cert(i){
 const d=S.id,s=S.a[i];
 $('#cm').innerHTML=`<div><div class="cert"><div class="o" style="color:#c9a46b;letter-spacing:.3em">ENGLISH QUEST II</div><h1 style="color:#e6cfa3">${T('cc')}</h1><p>${T('cd')}</p><div class="n">${esc(d.nm)}</div><p>${T('cl')} ${esc(d.cl)} · ${T('no')} ${esc(d.no)}<br>${esc(d.md)}</p><p>${T('cf')}<br><b style="color:#e6cfa3;font-size:18px">${A[i].t}</b></p><p>${T('cs')} <b style="color:#e6cfa3;font-size:26px">${s.sc}</b>/100</p><p style="font-size:13px;color:#a5b09a">${new Date().toLocaleDateString(L=='id'?'id-ID':'en-GB',{dateStyle:'long'})}<br>${T('by')} Ahmad Budi Leksono</p></div><p class="pb" style="text-align:center"><button class="btn" onclick="window.print()">🖨 ${T('pr')}</button> <button class="btn s" onclick="$('#cm').style.display='none'">${T('cl2')}</button></p></div>`;
 $('#cm').style.display='grid';
}
// ---- events ----
document.addEventListener('click',e=>{
 const t=e.target,n=t.closest('.nav');
 if(n&&n.id=='lo'){$('#app').style.display='none';$('#login').style.display='grid';$('#p').value='';return}
 if(n&&n.dataset.p){cur=n.dataset.p=='home'?'home':+n.dataset.p;$('#side').classList.remove('open');show()}
 if(t.id=='menu')$('#side').classList.toggle('open');
 if(t.id=='sv'){const d={nm:$('#i_nm').value.trim(),cl:$('#i_cl').value.trim(),no:$('#i_no').value.trim(),md:$('#i_md').value.trim()};
  if(!d.nm||!d.cl||!d.no||!d.md)return toast(T('need'));
  const key=Object.values(d).join('|').toLowerCase();
  if(key!=S.key){S=fresh();S.key=key;S.seed=hash(key);toast(T('saved'))}
  S.id=d;show()}
 if(t.id=='sb')submit(+cur);
 if(t.id=='rt'){const s=S.a[+cur];s.at++;Object.assign(s,{s:null,e:null,done:0,sc:null,ans:{}});show()}
 if(t.id=='ce')cert(+cur);
 if(t.id=='th'){const r=document.documentElement;r.dataset.theme=r.dataset.theme=='light'?'dark':'light';show()}
});
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(k&&cur!='home')S.a[+cur].ans[k]=e.target.value});
document.addEventListener('change',e=>{const k=e.target.dataset.k;if(k&&cur!='home')S.a[+cur].ans[k]=e.target.value});
$('#lg').onchange=e=>{L=e.target.value;document.documentElement.lang=L;lt();if($('#app').style.display=='grid')show()};
// ---- anti copy/paste ----
['copy','cut','paste','contextmenu','dragstart','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();if(ev!='contextmenu')toast(T('kunci'))}));
document.addEventListener('selectstart',e=>{if(!/INPUT|SELECT/.test(e.target.tagName||''))e.preventDefault()});
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(((e.ctrlKey||e.metaKey)&&'cvxauspi'.includes(k))||k=='f12'||(e.ctrlKey&&e.shiftKey&&'ijc'.includes(k))||k=='printscreen'){e.preventDefault();toast(T('kunci'))}});
// ---- login (credentials not shown anywhere on the page) ----
function lt(){$('#ls').textContent=T('ls');$('#u').placeholder=T('u');$('#p').placeholder=T('p');$('#lb').textContent=T('lb')}
function go(){if(btoa($('#u').value.trim())=='YWRtaW4='&&btoa($('#p').value)=='MTIz'){$('#le').textContent='';$('#login').style.display='none';$('#app').style.display='grid';cur='home';show()}else $('#le').textContent=T('le')}
$('#lb').onclick=go;$('#p').onkeydown=e=>{if(e.key=='Enter')go()};
lt();setInterval(tick,1000);
</script></body></html>
